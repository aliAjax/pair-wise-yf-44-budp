<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>化工装置变更与工艺安全管理</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #1f2937; background: #f9fafb; }
    main { max-width: 960px; margin: auto; }
    section { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 1.2rem 1.4rem; margin-bottom: 1.2rem; }
    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.1rem; margin-top: 0; }
    label { font-size: .9rem; margin-right: .8rem; }
    select, input, button { padding: .4rem .6rem; border-radius: 6px; border: 1px solid #d1d5db; font-size: .9rem; }
    button { cursor: pointer; background: #2563eb; color: #fff; border-color: #2563eb; margin: .2rem .2rem .2rem 0; }
    button.secondary { background: #fff; color: #2563eb; }
    button.safety { background: #b45309; border-color: #b45309; }
    button.go { background: #047857; border-color: #047857; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .card { border: 1px solid #e5e7eb; border-radius: 8px; padding: .8rem 1rem; margin: .6rem 0; }
    .muted { color: #6b7280; font-size: .85rem; }
    .tag { display: inline-block; font-size: .75rem; padding: .1rem .5rem; border-radius: 999px; margin-left: .4rem; }
    .tag.open { background: #fef3c7; color: #92400e; }
    .tag.completed { background: #dbeafe; color: #1e40af; }
    .tag.verified { background: #d1fae5; color: #065f46; }
    .tag.commissioned { background: #d1fae5; color: #065f46; }
    .tag.implemented { background: #ede9fe; color: #5b21b6; }
    .tag.other { background: #e5e7eb; color: #374151; }
    .expired { color: #b91c1c; font-weight: 600; }
    pre { background: #111827; color: #e5e7eb; padding: 1rem; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; font-size: .82rem; max-height: 340px; overflow-y: auto; }
    .blocker { background: #fef2f2; border-left: 4px solid #dc2626; padding: .5rem .8rem; margin: .3rem 0; border-radius: 4px; font-size: .88rem; }
    .ok-banner { background: #ecfdf5; border-left: 4px solid #059669; padding: .5rem .8rem; border-radius: 4px; }
    .error-banner { background: #fef2f2; border-left: 4px solid #dc2626; padding: .5rem .8rem; border-radius: 4px; }
    .item-row { padding: .5rem .6rem; border-top: 1px dashed #e5e7eb; font-size: .88rem; }
    code { background: #f3f4f6; padding: 0 .25rem; border-radius: 4px; }
  </style>
</head>
<body>
<main>
  <h1>化工装置变更与工艺安全管理 — 投产前安全确认</h1>

  <section>
    <h2>当前操作人</h2>
    <label>用户 <input id="userId" value="admin" size="10"></label>
    <label>角色
      <select id="role">
        <option value="admin">admin（管理员）</option>
        <option value="safety">safety（安全员）</option>
        <option value="engineer" selected>engineer（工程师）</option>
        <option value="verifier">verifier（校核人）</option>
        <option value="operator">operator（操作员）</option>
      </select>
    </label>
  </section>

  <section>
    <h2>1. 构造演示变更（自动跑评估→审批→实施→行动项完成/校核）</h2>
    <label>风险等级
      <select id="riskLevel">
        <option value="low">low 低</option>
        <option value="medium" selected>medium 中</option>
        <option value="high">high 高</option>
        <option value="critical">critical 极高</option>
      </select>
    </label>
    <label><input type="checkbox" id="expired"> 行动项有效期已过期</label>
    <label><input type="checkbox" id="selfCheck"> 校核人=完成人</label>
    <p><button onclick="setupDemo()">生成演示场景</button>
       <button class="secondary" onclick="refresh()">刷新列表</button></p>
    <p class="muted">说明：行动项创建时登记有效期；过期或自校核在“投产”时会返回阻断项。高风险（high/critical）还必须由安全员复核。</p>
  </section>

  <section>
    <h2>2. 变更与控制措施清单</h2>
    <div id="changes"><p class="muted">暂无数据，请先生成演示场景。</p></div>
  </section>

  <section>
    <h2>3. 处理结果</h2>
    <div id="banner"></div>
    <pre id="result">等待操作…</pre>
  </section>
</main>
<script>
const BLOCKER_TEXT = {
  control_expired: "控制措施已过有效期，需安全员延期",
  independent_check_required: "校核人与完成人相同，必须由第三人独立校核",
  safety_review_required: "高风险变更缺少安全员复核",
  action_item_not_verified: "行动项尚未完成独立校核",
  due_date_not_registered: "行动项未登记有效期"
};

function headers() {
  return {
    "Content-Type": "application/json",
    "X-User-Id": document.getElementById("userId").value || "anonymous",
    "X-Role": document.getElementById("role").value
  };
}

async function api(method, path, body) {
  const response = await fetch(path, {
    method,
    headers: headers(),
    body: body ? JSON.stringify(body) : undefined
  });
  const payload = await response.json();
  return { ok: response.ok, status: response.status, payload };
}

function show(result, payload) {
  document.getElementById("result").textContent = JSON.stringify(payload, null, 2);
  const banner = document.getElementById("banner");
  if (payload.blockers && payload.blockers.length) {
    banner.innerHTML = '<div class="error-banner"><strong>投产被阻断：</strong>' +
      payload.blockers.map(b =>
        '<div class="blocker">[' + b.code + '] ' + (BLOCKER_TEXT[b.code] || b.code) +
        (b.action_item_id ? ' <code>' + b.action_item_id.slice(0, 8) + '</code>' : '') +
        '</div>').join("") + '</div>';
  } else if (result.ok && payload.status === "commissioned") {
    banner.innerHTML = '<div class="ok-banner">✅ 投产成功，本次控制清单已冻结，共 ' +
      (payload.data.frozen_controls || []).length + ' 项控制措施。</div>';
  } else if (!result.ok) {
    banner.innerHTML = '<div class="error-banner">❌ ' + (payload.error || "请求失败") +
      ' <span class="muted">(' + payload.type + ')</span></div>';
  } else if (payload.rescheduled_from) {
    banner.innerHTML = '<div class="ok-banner">↪️ 已投产变更改期：已生成新的待办行动项 <code>' +
      payload.id.slice(0, 8) + '</code>，原冻结清单保持不变。</div>';
  } else if (payload.data && payload.data.extensions) {
    banner.innerHTML = '<div class="ok-banner">📅 延期已登记，原期限保留，当前有效期 ' +
      payload.data.extensions[payload.data.extensions.length - 1].new_due_date + '</div>';
  } else {
    banner.innerHTML = "";
  }
}

async function act(id, action, data) {
  const result = await api("POST", "/api/entities/" + id + "/actions", { action, data: data || {} });
  show(result, result.payload);
  await refresh();
  return result;
}

async function setupDemo() {
  const risk = document.getElementById("riskLevel").value;
  const expired = document.getElementById("expired").checked;
  const selfCheck = document.getElementById("selfCheck").checked;
  document.getElementById("role").value = "admin";
  document.getElementById("userId").value = "admin";

  const unit = await api("POST", "/api/units", { name: "Reactor-" + Date.now() % 1000, location: "Plant-A" });
  const change = await api("POST", "/api/changes", { unit_id: unit.payload.id, description: risk.toUpperCase() + " 风险变更演示" });
  const approvals = { low: ["S-1"], medium: ["S-1", "S-2"], high: ["S-1", "S-2", "S-3"], critical: ["S-1", "S-2", "S-3", "S-4"] }[risk];
  await api("POST", "/api/entities/" + change.payload.id + "/actions", { action: "assess", data: { risk_level: risk, analyst: "E-1" } });
  await api("POST", "/api/entities/" + change.payload.id + "/actions", { action: "approve", data: { approvals, permit_id: "MOC-" + Date.now() % 10000 } });
  await api("POST", "/api/entities/" + change.payload.id + "/actions", { action: "implement", data: { procedure_version: "v2" } });

  const due = expired ? isoDaysAgo(3) : isoDaysAhead(30);
  const item = await api("POST", "/api/action_items", {
    change_id: change.payload.id, description: "联锁与防护措施现场确认", owner: "O-1", due_date: due
  });
  await api("POST", "/api/entities/" + item.payload.id + "/actions", { action: "complete", data: { completed_by: "O-1", evidence: "signed-checklist" } });
  await api("POST", "/api/entities/" + item.payload.id + "/actions", { action: "verify", data: { verifier: selfCheck ? "O-1" : "V-1" } });

  show({ ok: true }, { message: "演示场景已生成（implemented），可在下方尝试 安全员复核 / 延期 / 投产", change_id: change.payload.id });
  await refresh();
}

function isoDaysAhead(n) { return new Date(Date.now() + n * 864e5).toISOString().slice(0, 10); }
function isoDaysAgo(n) { return new Date(Date.now() - n * 864e5).toISOString().slice(0, 10); }

function tagClass(status) {
  return ["open", "completed", "verified", "commissioned", "implemented"].includes(status) ? status : "other";
}

function itemHtml(item, changeStatus) {
  const d = item.data;
  const exts = d.extensions || [];
  const currentDue = exts.length ? exts[exts.length - 1].new_due_date : d.due_date;
  const isExpired = currentDue < isoDaysAgo(0);
  const selfChecked = d.verifier && d.verifier === d.completed_by;
  const frozen = changeStatus === "commissioned";
  return '<div class="item-row">' +
    '<div><strong>' + (d.description || item.id) + '</strong> ' +
    '<span class="tag ' + tagClass(item.status) + '">' + item.status + '</span>' +
    (isExpired ? ' <span class="expired">已过期</span>' : '') +
    (selfChecked ? ' <span class="expired">自校核</span>' : '') +
    (d.rescheduled_from ? ' <span class="muted">(改期新待办)</span>' : '') +
    '</div>' +
    '<div class="muted">负责人: ' + (d.owner || "-") +
    ' ｜ 登记有效期: ' + (d.due_date || "未登记") +
    (exts.length ? ' ｜ 当前有效期: ' + currentDue + '（延期 ' + exts.length + ' 次）' : "") +
    (d.completed_by ? ' ｜ 完成人: ' + d.completed_by : "") +
    (d.verifier ? ' ｜ 校核人: ' + d.verifier : "") +
    '</div>' +
    '<button class="secondary" onclick="extendItem(\'' + item.id + '\')">' +
    (frozen ? "改期（投产后续办）" : "发起延期") + '</button>' +
    exts.map(e => '<div class="muted">延期理由: “' + e.reason + '” 至 ' + e.new_due_date + '（' + e.extended_by + '）</div>').join("") +
    '</div>';
}

async function refresh() {
  const [changes, items] = await Promise.all([
    api("GET", "/api/changes"),
    api("GET", "/api/action_items")
  ]);
  const box = document.getElementById("changes");
  if (!changes.payload.items || !changes.payload.items.length) {
    box.innerHTML = '<p class="muted">暂无数据，请先生成演示场景。</p>';
    return;
  }
  box.innerHTML = changes.payload.items.map(change => {
    const d = change.data;
    const high = ["high", "critical"].includes(d.risk_level);
    const reviewed = !!d.safety_reviewed_by;
    const mine = items.payload.items.filter(i => i.data.change_id === change.id);
    return '<div class="card"><div><strong>' + (d.description || change.id) + '</strong> ' +
      '<span class="tag ' + tagClass(change.status) + '">' + change.status + '</span>' +
      ' <span class="muted">风险: ' + (d.risk_level || "-") + '</span></div>' +
      mine.map(i => itemHtml(i, change.status)).join("") +
      '<div style="margin-top:.5rem">' +
      (high && !reviewed && change.status === "implemented"
        ? '<button class="safety" onclick="safetyReview(\'' + change.id + '\')">安全员复核</button>' : "") +
      (reviewed ? '<span class="muted">✔ 已由 ' + reviewed + ' 完成安全员复核 ｜ </span>' : "") +
      (change.status === "implemented"
        ? '<button class="go" onclick="commission(\'' + change.id + '\')">申请投产</button>' : "") +
      (change.status === "commissioned"
        ? '<span class="muted">已投产，控制清单已冻结；对行动项“改期”将生成新待办。</span>' : "") +
      '</div></div>';
  }).join("");
}

async function extendItem(id) {
  const newDue = prompt("新的有效期（YYYY-MM-DD）", isoDaysAhead(14));
  if (!newDue) return;
  const reason = prompt("延期理由（必填）", "");
  if (reason === null) return;
  await act(id, "extend", { new_due_date: newDue, reason });
}

async function safetyReview(id) {
  await act(id, "safety_review", {});
}

async function commission(id) {
  await act(id, "commission", { tests_passed: true });
}

refresh();
</script>
</body>
</html>
